# SkyFunityLink 2.0: one plugin handles linking AND Coins/Funitys/Gems sync.
# Supabase project URL, e.g. https://YOURPROJECT.supabase.co
supabase-url: "https://YOURPROJECT.supabase.co"
# Supabase secret service_role key. Keep private on your Folia server!
# NEVER put this in GitHub, the website or a NEXT_PUBLIC_ variable.
supabase-service-role-key: "CHANGE_ME"
sync-seconds: 60
